<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#FF0080"/>
      <stop offset="100%" stop-color="#FF4D4D"/>
    </linearGradient>

    <linearGradient id="green-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 42px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 18px;
      fill: #58a6ff;
      letter-spacing: 2px;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #8b949e;
    }
    
    /* Smooth CSS Animations compatible across browsers */
    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.45; }
    }

    .card-anim-1 {
      animation: float1 6s ease-in-out infinite;
    }
    .card-anim-2 {
      animation: float2 8s ease-in-out infinite 1s;
    }
    .card-anim-3 {
      animation: float1 5s ease-in-out infinite 0.5s;
    }
    .orb-anim {
      animation: pulse 5s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="200" y1="0" x2="200" y2="350" />
    <line x1="400" y1="0" x2="400" y2="350" />
    <line x1="600" y1="0" x2="600" y2="350" />
    <line x1="800" y1="0" x2="800" y2="350" />
    <line x1="1000" y1="0" x2="1000" y2="350" />
  </g>

  <!-- Ambient Dynamic Orbs (Pure SVG Color Stop Glows) -->
  <circle class="orb-anim" cx="950" cy="150" r="160" fill="#7928CA" opacity="0.3" />
  <circle class="orb-anim" cx="200" cy="270" r="130" fill="#00F2FE" opacity="0.2" />

  <!-- Wave / Flow Decorative Lines -->
  <path d="M -100 280 Q 300 320 600 220 T 1300 180" fill="none" stroke="url(#green-blue-grad)" stroke-width="2" opacity="0.3" />
  <path d="M -100 100 Q 400 30 800 180 T 1300 100" fill="none" stroke="url(#primary-grad)" stroke-width="2" opacity="0.25" />

  <!-- DYNAMIC DECORATIVE CARDS / BADGES (RIGHT SIDE BACKGROUND) -->
  <g class="card-anim-1">
    <!-- Cloud Gaming Streaming Badge -->
    <rect x="760" y="60" width="220" height="70" rx="12" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="795" cy="95" r="18" fill="#7928CA" opacity="0.4"/>
    <path d="M788 95 C788 91 791 88 795 88 C799 88 802 91 802 95 C802 98 799 101 796 102 L794 102 C791 101 788 98 788 95 Z" fill="#FF0080"/>
    <text x="825" y="91" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#ffffff">Cloud Gaming</text>
    <text x="825" y="108" font-family="-apple-system, sans-serif" font-size="11" fill="#7ee787">● 60 FPS Ultra HD</text>
  </g>

  <g class="card-anim-2">
    <!-- Self-Hosted & Open Source Pill -->
    <rect x="910" y="160" width="230" height="75" rx="12" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="928" y="178" width="38" height="38" rx="8" fill="#00F2FE" opacity="0.2"/>
    <path d="M940 187 H954 M940 197 H954 M940 207 H954" stroke="#00F2FE" stroke-width="2" stroke-linecap="round"/>
    <text x="978" y="194" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#ffffff">Self-Hosted Stack</text>
    <text x="978" y="211" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Sunshine + Moonlight</text>
  </g>

  <g class="card-anim-3">
    <!-- Catalog Stat Card -->
    <rect x="710" y="190" width="170" height="85" rx="12" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5"/>
    <text x="730" y="222" font-family="-apple-system, sans-serif" font-weight="800" font-size="24" fill="url(#primary-grad)">500+ Games</text>
    <text x="730" y="244" font-family="-apple-system, sans-serif" font-weight="500" font-size="12" fill="#8b949e">SaaS &amp; Open-Source</text>
    <rect x="730" y="254" width="130" height="4" rx="2" fill="#30363d"/>
    <rect x="730" y="254" width="95" height="4" rx="2" fill="url(#primary-grad)"/>
  </g>

  <!-- FOREGROUND CONTENT (LEFT ALIGNED & CLEARLY VISIBLE) -->
  <g transform="translate(70, 0)">
    <!-- Subtitle / Category Tag -->
    <text x="0" y="95" class="subtitle">CURATED ECOSYSTEM &amp; DIRECTORY</text>

    <!-- Main Title with Gradient Text -->
    <text x="0" y="150" class="title">Video Game Subscription</text>
    <text x="0" y="198" class="title" fill="url(#primary-grad)">Services &amp; Open-Source</text>

    <!-- Description Lines -->
    <text x="0" y="248" class="desc">A curated collection of top SaaS platforms, cloud gaming infrastructure,</text>
    <text x="0" y="272" class="desc">and self-hosted open-source game library tools.</text>

    <!-- Status Badges / Pills -->
    <g transform="translate(0, 292)">
      <rect x="0" y="0" width="130" height="26" rx="13" fill="#21262d" stroke="#30363d"/>
      <circle cx="14" cy="13" r="4" fill="#7ee787"/>
      <text x="26" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#c9d1d9">Updated 2026</text>

      <rect x="140" y="0" width="145" height="26" rx="13" fill="#21262d" stroke="#30363d"/>
      <text x="152" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#58a6ff">★ Open Source Focus</text>
    </g>
  </g>
</svg>
